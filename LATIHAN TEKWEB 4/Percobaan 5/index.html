
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pretty To-Do List 🎀</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 10% 15%, #fff7fa, transparent 30%),
                radial-gradient(circle at 90% 85%, #ffd5e5, transparent 30%),
                linear-gradient(135deg, #ffeaf2, #ffc9dc, #fff0f5);
        }

        .container {
            width: 100%;
            max-width: 520px;
            position: relative;
        }

        /* Card utama */
        .todo-card {
            background: rgba(255, 255, 255, 0.92);
            padding: 35px;
            border-radius: 28px;
            border: 2px solid white;

            box-shadow: 0 15px 40px rgba(197, 91, 137, 0.18);

            animation: muncul 0.7s ease;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #c44c7c;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #bd829d;
            font-size: 14px;
        }

        .divider {
            width: 65px;
            height: 3px;
            background: #f3a4c3;
            border-radius: 10px;
            margin: 18px auto 0;
        }

        /* Input tugas */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;

            border: 2px solid #f5d3e0;
            border-radius: 13px;
            background: #fff8fb;

            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            outline: none;
            color: #a64d74;

            transition: 0.3s;
        }

        input:focus {
            border-color: #e77ca7;
            box-shadow: 0 0 0 4px rgba(231,124,167,0.12);
        }

        input::placeholder {
            color: #d2a0b5;
        }

        /* Tombol tambah */
        .add-btn {
            padding: 12px 17px;
            border: none;
            border-radius: 13px;

            background: linear-gradient(135deg, #f58bb5, #d85d91);
            color: white;

            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 14px;

            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(216,93,145,0.25);
        }

        /* Statistik */
        .task-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;

            color: #b65e84;
            font-size: 13px;
            font-weight: 800;
        }

        .task-count {
            background: #ffe6f0;
            padding: 7px 12px;
            border-radius: 20px;
        }

        /* Daftar tugas */
        #taskList {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 14px;
            border: 1px solid #f7dce7;
            background: #fff8fb;
            border-radius: 14px;

            transition: 0.3s;
            animation: muncul 0.3s ease;
        }

        .task-item:hover {
            background: #fff0f6;
            transform: translateX(3px);
        }

        /* Checkbox */
        .task-item input[type="checkbox"] {
            width: 19px;
            height: 19px;
            flex: 0 0 19px;
            margin: 0;
            accent-color: #e77ca7;
            cursor: pointer;
        }

        /* Teks tugas */
        .task-text {
            flex: 1;
            min-width: 0;
            color: #a64d74;
            font-size: 14px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        /* Tugas selesai */
        .completed .task-text {
            text-decoration: line-through;
            color: #c7a6b6;
        }

        /* Tombol hapus */
        .delete-btn {
            border: none;
            background: #ffe2ed;
            color: #d65b8d;

            width: 32px;
            height: 32px;
            border-radius: 9px;

            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #f4a4c2;
            color: white;
            transform: scale(1.1);
        }

        /* Kondisi kosong */
        .empty {
            text-align: center;
            padding: 28px 10px;
            color: #ca91aa;
            font-size: 14px;
            line-height: 1.8;
        }

        .empty span {
            font-size: 35px;
            display: block;
            margin-bottom: 8px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #c28aa4;
            font-size: 12px;
        }

        /* Animasi */
        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .todo-card {
                padding: 25px 18px;
            }

            h1 {
                font-size: 25px;
            }

            .input-area {
                flex-wrap: wrap;
            }

            .add-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="todo-card">

            <!-- Header -->
            <div class="header">
                <div class="icon">🎀</div>

                <h1>My Pretty To-Do List</h1>

                <p class="subtitle">
                    ♡ Make your day more productive ♡
                </p>

                <div class="divider"></div>
            </div>

            <!-- Input tugas -->
            <div class="input-area">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Tulis kegiatan kamu... 🌷"
                >

                <button class="add-btn" id="addBtn">
                    + Tambah
                </button>
            </div>

            <!-- Informasi tugas -->
            <div class="task-info">
                <span>🌸 My Daily Tasks</span>

                <span class="task-count" id="taskCount">
                    0 Tugas
                </span>
            </div>

            <!-- Daftar tugas -->
            <ul id="taskList"></ul>

            <!-- Footer -->
            <div class="footer">
                ✨ Small steps every day! ✨
                <br>
                Made with love ♡
            </div>

        </div>

    </div>

    <script src="script5.js"></script>

</body>
</html>
