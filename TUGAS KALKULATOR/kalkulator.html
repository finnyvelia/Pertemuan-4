
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Calculator</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    /* Background hutan hijau */
    background:
        linear-gradient(
            rgba(0, 0, 0, 0.12),
            rgba(0, 0, 0, 0.12)
        ),
        url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdsHaCeEiBBFZZwKsDMkoYEMvHEJs1x3B8Ki7pHqmDJQ&s=10");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Badan kalkulator */
        .calculator {
            width: 260px;
            padding: 15px 17px 13px;

            background: linear-gradient(
                145deg,
                #fffef5,
                #eee9d8
            );

            border: 2px solid #e2ddca;
            border-radius: 29px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.28),
                inset 0 2px 5px white;

            position: relative;
        }

        /* Judul kalkulator */
        .brand {
            text-align: center;
            color: #647c5c;
            margin-bottom: 11px;
        }

        .brand h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand p {
            font-size: 8px;
            font-weight: 700;
            margin-top: 1px;
            color: #829477;
        }

        /* Layar LCD */
        .display {
            height: 77px;
            padding: 7px 12px;

            display: flex;
            align-items: center;
            justify-content: flex-end;

            background: #9eae91;
            border: 5px solid #dce3cf;
            outline: 1px solid #c4cfb5;
            border-radius: 16px;

            margin-bottom: 12px;
            box-shadow: inset 0 3px 7px rgba(0,0,0,0.16);
        }

        #layar {
            width: 100%;
            color: #26392c;
            font-family: 'DM Mono', monospace;
            font-size: 31px;
            text-align: right;
            overflow-wrap: anywhere;
        }

        /* Input angka */
        .input-group {
            background: #e2e8d4;
            padding: 5px 9px 7px;
            border-radius: 12px;
            margin-bottom: 7px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #627b59;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .input-group input {
            width: 100%;
            height: 27px;
            border: 1px solid #c2cdaF;
            border-radius: 8px;
            outline: none;

            padding: 4px 8px;
            background: #f7f7ed;
            color: #40563d;

            font-family: 'DM Mono', monospace;
            font-size: 12px;
        }

        .input-group input:focus {
            border-color: #829a72;
        }

        /* Judul tombol */
        .button-title {
            text-align: center;
            color: #718667;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin: 11px 0 8px;
        }

        /* Tombol operasi */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
        }

        .buttons button {
            height: 39px;
            border: 1px solid #b8c4a7;
            border-radius: 12px;

            background: linear-gradient(
                145deg,
                #e8edda,
                #cbd7bb
            );

            color: #5a7051;
            font-size: 22px;
            font-weight: 800;

            cursor: pointer;

            box-shadow: 0 3px 0 #a8b497;
            transition: 0.15s;
        }

        .buttons button:hover {
            background: #c6d5b8;
            transform: translateY(-2px);
        }

        .buttons button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #a8b497;
        }

        /* Kotak hasil */
        .result {
            position: relative;
            margin-top: 13px;
            min-height: 75px;

            padding: 8px 10px;
            text-align: center;

            background: #e8ead8;
            border: 2px dashed #aab99a;
            border-radius: 17px;
        }

        .result p {
            color: #6e8563;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        #hasil {
            color: #344c38;
            font-family: 'DM Mono', monospace;
            font-size: 25px;
            margin-top: 3px;
            overflow-wrap: anywhere;
        }

        /* Hiasan bawah */
        .decoration {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 3px;
            padding: 0 2px;
        }

        .cat {
            font-size: 27px;
        }

        .plant {
            color: #82966e;
            font-size: 23px;
        }

        .footer {
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            margin-top: 13px;
            text-shadow: 1px 2px 5px #243b25;
        }

        @media (max-width: 400px) {
            .calculator {
                width: 250px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="calculator">

            <div class="brand">
                <h1>🌿 Garden Calculator 🌿</h1>
                <p>♥ Small steps. Big results. ♥</p>
            </div>

            <div class="display">
                <div id="layar">0</div>
            </div>

            <div class="input-group">
                <label for="angka1">FIRST NUMBER</label>
                <input
                    type="number"
                    id="angka1"
                    placeholder="Masukkan angka pertama"
                >
            </div>

            <div class="input-group">
                <label for="angka2">SECOND NUMBER</label>
                <input
                    type="number"
                    id="angka2"
                    placeholder="Masukkan angka kedua"
                >
            </div>

            <div class="button-title">
                🌱 CHOOSE OPERATION 🌱
            </div>

            <div class="buttons">
                <button onclick="hitung('+')">+</button>
                <button onclick="hitung('-')">−</button>
                <button onclick="hitung('*')">×</button>
                <button onclick="hitung('/')">÷</button>
            </div>

            <div class="result">
                <p>RESULT</p>
                <div id="hasil">0</div>
            </div>

            <div class="decoration">
                <span class="cat">🐈</span>
                <span class="plant">🌱</span>
            </div>

        </div>

        <div class="footer">
            Have a nice day ♡
        </div>

    </div>

    <script src="kalkulator.js"></script>

</body>
</html>
